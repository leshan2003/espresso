name: Verify release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python tools/audit_release.py
      - run: python tools/check_model.py
      - run: cmake -S . -B build && cmake --build build && ctest --test-dir build --output-on-failure
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python tools/check_rtl.py
      - run: python results/resource/plot.py
